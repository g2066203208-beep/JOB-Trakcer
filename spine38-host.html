<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0c0f14}canvas{display:block;width:100%;height:100%}</style></head><body><canvas id="c"></canvas><script src="./vendor/spine38canvas.js?v=0.8.6"></script><script>
(()=>{const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');const S={ready:false,error:null,am:null,data:null,skeleton:null,renderer:null,view:{w:1,h:1,zoom:1,x:0,y:0,visible:true,opacity:1},active:null};
