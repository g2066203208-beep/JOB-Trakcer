<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Character Puppet Lab</title>
<style>
:root{--panel:#1d2129;--ink:#f2f4f8;--muted:#9ea7b3;--accent:#ff6f91;--line:#63d7ff}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:radial-gradient(circle at 50% 10%,#252b35,#0d0f14 68%);color:var(--ink);font-family:Inter,"PingFang SC","Microsoft YaHei",sans-serif}
body{min-height:100svh;display:grid;place-items:center;padding:18px}
.app{width:min(100%,980px);display:grid;grid-template-columns:minmax(300px,520px) minmax(260px,1fr);gap:18px;align-items:center}
.card{background:rgba(25,29,36,.92);border:1px solid rgba(255,255,255,.08);border-radius:22px;box-shadow:0 24px 70px rgba(0,0,0,.36);overflow:hidden}
.stage{position:relative;aspect-ratio:300/339;touch-action:none;user-select:none;background:#6f8077;isolation:isolate}
.stage svg{position:absolute;inset:0;width:100%;height:100%;display:block}.under{filter:saturate(.92) brightness(.72);opacity:.38}.part{transform-box:view-box;will-change:transform}
#hairBack{transform-origin:150px 126px}#hairFront{transform-origin:150px 96px}#head{transform-origin:151px 149px}#torso{transform-origin:151px 250px}#leftArm{transform-origin:87px 207px}#rightArm{transform-origin:229px 204px}#tie{transform-origin:158px 205px}#lower{transform-origin:156px 292px}
.debug{opacity:0;transition:.2s}.show-debug .debug{opacity:1}.joint{fill:#fff;stroke:#111;stroke-width:1.5}.bone{stroke:var(--line);stroke-width:2;stroke-dasharray:5 4;vector-effect:non-scaling-stroke}
.badge,.fps{position:absolute;top:12px;padding:7px 10px;border-radius:999px;background:rgba(0,0,0,.58);backdrop-filter:blur(8px);font-size:12px;z-index:4}.badge{left:12px}.fps{right:12px;font:11px ui-monospace,monospace}
.panel{padding:22px}h1{font-size:22px;margin:0 0 8px}p{color:var(--muted);line-height:1.6;margin:0 0 18px;font-size:14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
button{appearance:none;border:0;border-radius:13px;padding:12px 14px;background:#2a303a;color:#fff;font-weight:700;font-size:14px;cursor:pointer;transition:.16s}button:hover{transform:translateY(-1px);background:#343b47}button.primary{background:var(--accent);color:#1a0d12}button.is-on{outline:2px solid var(--line);outline-offset:1px}
.stat{display:grid;grid-template-columns:1fr auto;gap:8px;padding:10px 0;border-top:1px solid rgba(255,255,255,.07);font-size:13px}.stat span:last-child{color:#b8f4ff;font-family:ui-monospace,monospace}.legend{font-size:12px;color:var(--muted);line-height:1.7;margin-top:14px}
@media(max-width:760px){body{padding:0}.app{display:block;width:100%;min-height:100svh}.card{border-radius:0;border-left:0;border-right:0}.stage-card,.panel-card{max-width:520px;margin:auto}}
</style>
</head>
<body>
<div class="app">
<section class="card stage-card"><div id="stage" class="stage">
<div class="badge">JOB-Trakcer · Puppet Lab · v2</div><div id="fps" class="fps">-- fps</div><div id="imgError" style="display:none;position:absolute;left:16px;right:16px;top:64px;z-index:9;padding:12px;border-radius:12px;background:#7d1f2d;color:white;font-size:13px">角色图片加载失败</div>
<svg viewBox="0 0 300 339" aria-label="黑长发水手服角色动态纸偶">
<defs>
<clipPath id="cHairBack"><path d="M60 9L240 0 278 42 279 235 229 275 216 190 76 196 59 267 25 234 46 66Z"/></clipPath>
<clipPath id="cHairFront"><path d="M84 8L224 7 241 41 223 155 199 192 101 187 75 148 61 62Z"/></clipPath>
<clipPath id="cHead"><path d="M82 57L222 51 239 106 222 177 194 199 113 197 77 173 64 111Z"/></clipPath>
<clipPath id="cTorso"><path d="M86 173L231 168 264 222 241 339 77 339 53 235Z"/></clipPath>
<clipPath id="cLArm"><path d="M0 205L93 170 118 216 86 246 113 300 74 339 42 285 0 261Z"/></clipPath>
<clipPath id="cRArm"><path d="M215 170L276 190 300 246 293 339 238 339 221 257 195 221Z"/></clipPath>
<clipPath id="cTie"><path d="M121 185L196 186 190 232 174 339 129 339 141 231Z"/></clipPath>
<clipPath id="cLower"><path d="M55 261L254 257 276 339 34 339Z"/></clipPath>
</defs>
<image href="./character.jpg?v=2" class="under" width="300" height="339" preserveAspectRatio="none"/>
<g id="hairBack" class="part" clip-path="url(#cHairBack)"><image href="./character.jpg?v=2" width="300" height="339" preserveAspectRatio="none"/></g>
<g id="torso" class="part" clip-path="url(#cTorso)"><image href="./character.jpg?v=2" width="300" height="339" preserveAspectRatio="none"/></g>
<g id="lower" class="part" clip-path="url(#cLower)"><image href="./character.jpg?v=2" width="300" height="339" preserveAspectRatio="none"/></g>
<g id="leftArm" class="part" clip-path="url(#cLArm)"><image href="./character.jpg?v=2" width="300" height="339" preserveAspectRatio="none"/></g>
<g id="rightArm" class="part" clip-path="url(#cRArm)"><image href="./character.jpg?v=2" width="300" height="339" preserveAspectRatio="none"/></g>
<g id="head" class="part" clip-path="url(#cHead)"><image href="./character.jpg?v=2" width="300" height="339" preserveAspectRatio="none"/></g>
<g id="hairFront" class="part" clip-path="url(#cHairFront)"><image href="./character.jpg?v=2" width="300" height="339" preserveAspectRatio="none"/></g>
<g id="tie" class="part" clip-path="url(#cTie)"><image href="./character.jpg?v=2" width="300" height="339" preserveAspectRatio="none"/></g>
<g class="debug" pointer-events="none">
<path class="bone" d="M151 112L151 204L151 267M151 204L86 207M151 204L229 204M151 267L110 330M151 267L201 330"/>
<circle class="joint" cx="151" cy="112" r="4"/><circle class="joint" cx="151" cy="204" r="4"/><circle class="joint" cx="86" cy="207" r="4"/><circle class="joint" cx="229" cy="204" r="4"/><circle class="joint" cx="151" cy="267" r="4"/>
</g></svg></div></section>
<section class="card panel-card"><div class="panel">
<h1>角色自动纸偶实验</h1>
<p>直接使用你发来的角色画面做 8 区纸偶驱动。移动鼠标或手指，头部会跟随；头发、身体、手臂和领巾有独立惯性。</p>
<div class="grid"><button id="autoBtn" class="primary is-on">自动演示：开</button><button id="talkBtn">说话动作</button><button id="debugBtn">骨骼显示：关</button><button id="resetBtn">回正</button></div>
<div class="stat"><span>分区节点</span><span>8</span></div><div class="stat"><span>头部跟随</span><span id="headStat">0.0°</span></div><div class="stat"><span>头发惯性</span><span id="hairStat">0.0°</span></div><div class="stat"><span>呼吸幅度</span><span id="breathStat">0.0%</span></div>
<div class="legend">这是独立实验页，只放在 JOB-Trakcer/character-puppet-lab/，没有改 JOB-Trakcer 主站功能，也没有改 paperchalk-world。</div>
</div></section></div>
<script>
const stage=document.getElementById('stage'),$=id=>document.getElementById(id);
const p={hairBack:$('hairBack'),hairFront:$('hairFront'),head:$('head'),torso:$('torso'),leftArm:$('leftArm'),rightArm:$('rightArm'),tie:$('tie'),lower:$('lower')};
let auto=true,debug=false,talk=0,last=performance.now(),frames=0,fpsClock=last,targetX=0,targetY=0,pointerActive=false;
const s={hair:0,hairV:0,head:0,headV:0,tie:0,tieV:0};
function damp(n,target,dt,k=34,d=.78){const v=n+'V';s[v]+=(target-s[n])*k*dt;s[v]*=Math.pow(d,dt*60);s[n]+=s[v]*dt*60;return s[n]}
function point(x,y){const r=stage.getBoundingClientRect();targetX=((x-r.left)/r.width-.5)*2;targetY=((y-r.top)/r.height-.5)*2;pointerActive=true}
stage.addEventListener('pointermove',e=>point(e.clientX,e.clientY));stage.addEventListener('pointerdown',e=>point(e.clientX,e.clientY));stage.addEventListener('pointerleave',()=>pointerActive=false);
$('autoBtn').onclick=()=>{auto=!auto;$('autoBtn').textContent='自动演示：'+(auto?'开':'关');$('autoBtn').classList.toggle('is-on',auto)};
$('debugBtn').onclick=()=>{debug=!debug;stage.classList.toggle('show-debug',debug);$('debugBtn').textContent='骨骼显示：'+(debug?'开':'关');$('debugBtn').classList.toggle('is-on',debug)};
$('talkBtn').onclick=()=>talk=1;$('resetBtn').onclick=()=>{targetX=targetY=0;pointerActive=false;talk=0};
function tr(el,deg=0,x=0,y=0,sx=1,sy=1){el.style.transform='translate('+x+'px,'+y+'px) rotate('+deg+'deg) scale('+sx+','+sy+')'}
function loop(now){const dt=Math.min(.035,(now-last)/1000||.016);last=now;const t=now/1000;
if(!pointerActive&&auto){targetX=Math.sin(t*.73)*.38;targetY=Math.sin(t*.51)*.18}else if(!pointerActive){targetX*=.94;targetY*=.94}
if(talk>0)talk=Math.max(0,talk-dt*1.35);const tw=talk>0?Math.sin((1-talk)*Math.PI*5)*talk:0;
const head=damp('head',targetX*5.5+tw*2.1,dt,30,.76),hair=damp('hair',-head*.48-targetX*1.8,dt,19,.82),tie=damp('tie',-head*.35+Math.sin(t*1.9)*1.2+tw*2.7,dt,14,.84);
const breath=(Math.sin(t*1.75)+1)*.5,b=.006+breath*.010,bob=Math.sin(t*1.75)*.55+tw*1.1;
tr(p.torso,-head*.12,0,bob,1,1+b);tr(p.lower,head*.08,0,bob*.4,1,1+b*.35);tr(p.head,head,targetX*1.2,targetY*.8+bob*.42);
tr(p.hairFront,head*.82+hair*.55,targetX*1.5,targetY*.7+bob*.35);tr(p.hairBack,head*.55+hair*.92,targetX*.7,targetY*.3+bob*.25);tr(p.tie,tie,0,bob*.7,1,1+b*.25);
tr(p.leftArm,-1.1+Math.sin(t*1.4)*.6-tw*1.4,0,bob*.45);tr(p.rightArm,1.1-Math.sin(t*1.4)*.7+tw*4.8,0,bob*.45);
$('headStat').textContent=head.toFixed(1)+'°';$('hairStat').textContent=hair.toFixed(1)+'°';$('breathStat').textContent=(b*100).toFixed(1)+'%';
frames++;if(now-fpsClock>500){$('fps').textContent=Math.round(frames*1000/(now-fpsClock))+' fps';frames=0;fpsClock=now}requestAnimationFrame(loop)}
const probe=new Image();
probe.onload=()=>{document.getElementById('imgError').style.display='none'};
probe.onerror=()=>{document.getElementById('imgError').style.display='block'};
probe.src='./character.jpg?v=2';
requestAnimationFrame(loop);
</script></body></html>
