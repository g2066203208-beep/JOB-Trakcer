name: Build 2025 B Paper OCR Full Spoken Lessons
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-boc-2025-b-full-spoken.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install OCR dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y tesseract-ocr tesseract-ocr-eng tesseract-ocr-chi-sim
          python -m pip install pymupdf
      - name: Build chapters from the uploaded B paper
        run: |
          python '秋招工作室/笔试面试备考/中国银行2027_基础岗位类/generate_2025_B_full_spoken.py'
      - name: Commit grounded manuscripts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '秋招工作室/笔试面试备考/中国银行2027_基础岗位类/历年试题资料/2025/B卷48页_原题全文OCR_待核对.md' '秋招工作室/笔试面试备考/中国银行2027_基础岗位类/2025双卷语音授课工作室/B卷_全文校对口播_'*.md
          if ! git diff --cached --quiet; then
            git commit -m 'Publish B-paper 95 source-anchored complete spoken chapters'
            git push
          fi
