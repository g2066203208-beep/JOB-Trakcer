name: Refine Tie With EVF-SAM2
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/evf-refine-tie.yml"
      - "scripts/evf-refine-tie.mjs"

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install segmentation client
        run: npm install --no-save @gradio/client sharp
      - name: Segment red necktie with EVF-SAM2
        run: node scripts/evf-refine-tie.mjs
      - name: Commit refined tie masks
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add character-see-through-lab/static-result/refine-tie-*
          git diff --cached --quiet && exit 0
          git commit -m "Add EVF-SAM2 necktie refinement"
          git push
