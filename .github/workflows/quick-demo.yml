name: Rig Forge Quick Real-Image Demo
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  demo:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install Chromium runner
        run: |
          npm init -y
          npm install playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Download public-domain test character
        run: curl -L --fail --retry 3 -o /tmp/test-character.png https://openclipart.org/image/2000px/171797
      - name: Start studio
        run: |
          python3 -m http.server 4173 > /tmp/rig-forge-server.log 2>&1 &
          sleep 3
      - name: Run and export
        run: node e2e/run-quick-demo.mjs
      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: character-rig-forge-quick-result
          path: artifacts/rig-forge-quick/
