name: Pixel Studio Smoke

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: browser-actions/setup-chrome@v1
      - run: python3 -m pip install --quiet selenium
      - name: Test hosted pixel studio
        env:
          URL: https://g2066203208-beep.github.io/JOB-Trakcer/pixel-animation-studio/
        run: |
          python3 - <<'PY'
          import os,time,json
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.common.by import By
          from selenium.webdriver.common.alert import Alert

          opts=Options()
          opts.add_argument("--headless=new")
          opts.add_argument("--no-sandbox")
          opts.add_argument("--disable-gpu")
          opts.add_argument("--window-size=1440,1000")
          opts.set_capability("goog:loggingPrefs", {"browser":"ALL"})
          d=webdriver.Chrome(options=opts)
          d.get(os.environ["URL"])
          time.sleep(2)
          print("BEFORE", d.execute_script("""
            return {
              title:document.title,
              button:!!document.querySelector('#loadRunSample'),
              status:document.querySelector('#status')?.textContent,
              frame:document.querySelector('#frameCounter')?.textContent,
              cards:document.querySelectorAll('.frame-card').length
            }
          """))
          print("LOG_BEFORE",json.dumps(d.get_log("browser"),ensure_ascii=False))
          d.find_element(By.ID,"loadRunSample").click()
          time.sleep(.3)
          try:
            alert=d.switch_to.alert
            print("ALERT",alert.text)
            alert.accept()
          except Exception as e:
            print("NO_ALERT",type(e).__name__)
          time.sleep(2)
          after=d.execute_script("""
            return {
              status:document.querySelector('#status')?.textContent,
              frame:document.querySelector('#frameCounter')?.textContent,
              cards:document.querySelectorAll('.frame-card').length,
              layers:document.querySelectorAll('.layer-item').length,
              project:document.querySelector('#projectName')?.textContent,
              play:document.querySelector('#playPause')?.textContent,
              canvas:[document.querySelector('#displayCanvas')?.width,document.querySelector('#displayCanvas')?.height]
            }
          """)
          print("AFTER",after)
          logs=d.get_log("browser")
          print("LOG_AFTER",json.dumps(logs,ensure_ascii=False))
          d.save_screenshot("/tmp/pixel-studio.png")
          assert after["cards"]==8, after
          assert after["layers"]==11, after
          assert "双马尾蓝衣少女" in after["project"], after
          d.quit()
          PY
