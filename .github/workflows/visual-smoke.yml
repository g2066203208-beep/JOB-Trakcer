name: Visual Smoke Test

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Chrome
        uses: browser-actions/setup-chrome@v1
      - name: Install Selenium
        run: python3 -m pip install --quiet selenium
      - name: Verify hosted rig interactions
        shell: bash
        run: |
          set -euxo pipefail
          URL="https://g2066203208-beep.github.io/JOB-Trakcer/"
          mkdir -p visual-smoke
          found=0
          for i in {1..40}; do
            if curl -fsSL "$URL" | grep -q "v0.6.1"; then found=1; break; fi
            sleep 3
          done
          test "$found" = "1"
          cat > /tmp/capture.py <<'PY'
          import json, time, os
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.common.by import By
          from selenium.webdriver.support.ui import WebDriverWait, Select
          from selenium.webdriver.common.action_chains import ActionChains

          out="visual-smoke"
          url=os.environ["RIG_URL"]
          opts=Options()
          opts.add_argument("--headless=new")
          opts.add_argument("--no-sandbox")
          opts.add_argument("--disable-gpu")
          opts.add_argument("--enable-unsafe-swiftshader")
          opts.add_argument("--window-size=1600,1000")
          d=webdriver.Chrome(options=opts)
          d.set_window_size(1600,1000)
          d.get(url)
          wait=WebDriverWait(d,35)
          wait.until(lambda x: "Runtime ✓" in x.find_element(By.ID,"hud").text)
          time.sleep(.8)

          checks={}
          def stale_visible():
              return d.execute_script("""
                const sp=spineRT.display;
                if(!sp) return -1;
                let n=0;
                for(let i=0;i<sp.skeleton.slots.length;i++){
                  if(!sp.skeleton.slots[i].attachment && sp.slotContainers?.[i]?.visible) n++;
                }
                return n;
              """)
          def shot(name):
              checks[name+"_hud"]=d.find_element(By.ID,"hud").text
              checks[name+"_stale_empty_slots"]=stale_visible()
              d.save_screenshot(f"{out}/{name}.png")

          # Bulk learning corpus must be loaded into the hosted UI.
          train=d.find_element(By.CSS_SELECTOR,'[data-ins="train"]')
          train.click()
          time.sleep(.8)
          train_text=d.find_element(By.ID,"insPane").text
          checks["training_text"]=train_text
          assert "85 个有效角色" in train_text, train_text
          assert "425 个 Spine 工程" in train_text, train_text
          assert "139 个工程" in train_text or "136 个工程" in train_text or "142 个工程" in train_text, train_text
          d.save_screenshot(f"{out}/training-corpus.png")
          d.find_element(By.ID,"showCorpusChars").click()
          time.sleep(.4)
          corpus_text=d.find_element(By.ID,"modal").text
          checks["corpus_has_kal"]=("凯尔希" in corpus_text)
          checks["corpus_has_thorns"]=("棘刺" in corpus_text)
          checks["corpus_has_texas"]=("德克萨斯" in corpus_text)
          checks["corpus_has_guard_amiya"]=("阿米娅（近卫）" in corpus_text)
          checks["corpus_invalid_xiao"]=("阿消（损坏）" in corpus_text)
          assert all([checks["corpus_has_kal"],checks["corpus_has_thorns"],checks["corpus_has_texas"],checks["corpus_has_guard_amiya"],checks["corpus_invalid_xiao"]]), checks
          d.save_screenshot(f"{out}/corpus-characters.png")
          d.find_element(By.CSS_SELECTOR,"[data-close]").click()
          d.find_element(By.CSS_SELECTOR,'[data-ins="bone"]').click()
          time.sleep(.3)

          # Base-building corpus must also use the large batch.
          d.find_element(By.CSS_SELECTOR,'[data-case="amiya-default-base"]').click()
          wait.until(lambda x: "Runtime ✓" in x.find_element(By.ID,"hud").text)
          time.sleep(.6)
          Select(d.find_element(By.ID,"animSelect")).select_by_value("action:Interact")
          d.find_element(By.CSS_SELECTOR,'[data-ins="train"]').click()
          time.sleep(.6)
          base_text=d.find_element(By.ID,"insPane").text
          checks["base_training_text"]=base_text
          assert "基建 · 142 个工程" in base_text, base_text
          assert "Interact" in base_text, base_text
          assert "84 个" in base_text, base_text
          d.save_screenshot(f"{out}/training-base-interact.png")
          d.find_element(By.CSS_SELECTOR,'[data-case="amiya-default-front"]').click()
          wait.until(lambda x: "Runtime ✓" in x.find_element(By.ID,"hud").text)
          time.sleep(.5)
          d.find_element(By.CSS_SELECTOR,'[data-ins="bone"]').click()
          time.sleep(.3)

          # Case templates must be read-only and Save must open Save As.
          checks["case_save_button"]=d.find_element(By.ID,"saveBtn").text
          assert checks["case_save_button"]=="另存为", checks
          d.find_element(By.ID,"saveBtn").click()
          wait.until(lambda x: x.find_element(By.ID,"modalWrap").get_attribute("class").find("show")>=0)
          checks["save_as_modal"]=d.find_element(By.ID,"modal").text
          assert "只读模板" in checks["save_as_modal"]
          d.find_element(By.CSS_SELECTOR,"[data-close]").click()

          shot("idle")

          # Attack must keep repeating while Loop is enabled.
          sel=Select(d.find_element(By.ID,"animSelect"))
          sel.select_by_value("action:Attack")
          d.find_element(By.ID,"playBtn").click()
          time.sleep(4.8)
          checks["attack_loop_selected"]=Select(d.find_element(By.ID,"animSelect")).first_selected_option.get_attribute("value")
          checks["attack_loop_button"]=d.find_element(By.ID,"loopBtn").text
          assert checks["attack_loop_selected"]=="action:Attack", checks
          assert "✓" in checks["attack_loop_button"], checks
          shot("attack-loop")

          # Switching away must immediately clear perspective-part residue.
          Select(d.find_element(By.ID,"animSelect")).select_by_value("action:Idle")
          time.sleep(.8)
          shot("idle-after-attack")
          assert checks["idle-after-attack_stale_empty_slots"]==0, checks
          d.execute_script("state.playing=false; state.lastT=0; renderMeta();")

          # With loop disabled, a one-shot returns to Idle after completion.
          d.find_element(By.ID,"loopBtn").click()
          Select(d.find_element(By.ID,"animSelect")).select_by_value("action:Attack")
          d.find_element(By.ID,"playBtn").click()
          time.sleep(3.0)
          checks["attack_no_loop_selected"]=Select(d.find_element(By.ID,"animSelect")).first_selected_option.get_attribute("value")
          assert checks["attack_no_loop_selected"]=="action:Idle", checks
          shot("attack-no-loop-after")
          assert checks["attack-no-loop-after_stale_empty_slots"]==0, checks

          # Skill uses the same cleanup rule.
          d.find_element(By.ID,"loopBtn").click()
          Select(d.find_element(By.ID,"animSelect")).select_by_value("action:Skill")
          d.find_element(By.ID,"playBtn").click()
          time.sleep(3.2)
          shot("skill-loop")
          Select(d.find_element(By.ID,"animSelect")).select_by_value("action:Idle")
          time.sleep(.8)
          shot("idle-after-skill")
          assert checks["idle-after-skill_stale_empty_slots"]==0, checks

          # Direct mouse edit smoke test: drag one visible joint.
          point=d.execute_script("""
            const a=runtimePoseScreen().filter(x=>x.parent && Math.hypot(x.x-x.parent.x,x.y-x.parent.y)>18);
            const p=a.find(x=>x.x>40&&x.y>40&&x.x<document.querySelector('#stage').clientWidth-40&&x.y<document.querySelector('#stage').clientHeight-40)||a[0];
            return p?{x:p.x,y:p.y,name:p.name}:null;
          """)
          checks["mouse_target"]=point
          if point:
              canvas=d.find_element(By.ID,"stage")
              # Freeze on a non-round time so a drag must change the timeline data.
              slider=d.find_element(By.ID,"timeRange")
              d.execute_script("arguments[0].value='0.413'; arguments[0].dispatchEvent(new Event('input',{bubbles:true}));",slider)
              time.sleep(.3)
              checks["mouse_before_translate"]=d.execute_script("""
                const seg=segmentAtTime(),name=arguments[0];
                return JSON.stringify(state.project.animations?.[seg.name]?.bones?.[name]?.translate||[]);
              """,point["name"])
              size=canvas.size
              ox=point["x"]-size["width"]/2
              oy=point["y"]-size["height"]/2
              ActionChains(d).move_to_element_with_offset(canvas,ox,oy).click_and_hold().move_by_offset(18,6).release().perform()
              time.sleep(1.4)
              checks["mouse_drag_selected"]=d.execute_script("return state.selectedBone")
              checks["mouse_after_translate"]=d.execute_script("""
                const seg=segmentAtTime(),name=arguments[0];
                return JSON.stringify(state.project.animations?.[seg.name]?.bones?.[name]?.translate||[]);
              """,point["name"])
              checks["mouse_playing_after_drag"]=d.execute_script("return state.playing")
              assert checks["mouse_drag_selected"]==point["name"], checks
              assert checks["mouse_after_translate"]!=checks["mouse_before_translate"], checks
              assert checks["mouse_playing_after_drag"] is False, checks

          open(f"{out}/checks.json","w",encoding="utf-8").write(json.dumps(checks,ensure_ascii=False,indent=2))
          open(f"{out}/dom.html","w",encoding="utf-8").write(d.page_source)
          d.quit()
          PY
          RIG_URL="$URL" python3 /tmp/capture.py
          cat visual-smoke/checks.json
          ls -lah visual-smoke
      - name: Upload visual smoke artifact
        uses: actions/upload-artifact@v4
        with:
          name: visual-smoke
          path: visual-smoke/
