name: Auto discover recruitment jobs

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "扫描模式"
        required: true
        default: "full"
        type: choice
        options:
          - full
          - recent
      company:
        description: "只扫描某一家企业（可留空）"
        required: false
        type: string
  push:
    paths:
      - "crawler/**"
      - ".github/workflows/auto-discover.yml"
  schedule:
    - cron: "17 */4 * * *"

permissions:
  contents: write

concurrency:
  group: auto-discover-recruitment
  cancel-in-progress: true

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install crawler dependencies
        run: pip install -r crawler/requirements.txt

      - name: Discover jobs
        env:
          BRAVE_SEARCH_API_KEY: ${{ secrets.BRAVE_SEARCH_API_KEY }}
          MANUAL_SCAN_MODE: ${{ github.event.inputs.mode }}
          MANUAL_COMPANY: ${{ github.event.inputs.company }}
        run: python crawler/crawl_jobs.py

      - name: Commit discovered jobs
        run: |
          if [ -z "$(git status --porcelain -- data/auto-jobs.json auto-jobs-data.js crawler/state.json)" ]; then
            echo "No changes."
            exit 0
          fi
          git config user.name "job-tracker-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/auto-jobs.json auto-jobs-data.js crawler/state.json
          git commit -m "data: auto-discover recruitment updates"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
