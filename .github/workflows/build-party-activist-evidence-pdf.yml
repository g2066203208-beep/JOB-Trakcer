name: Compile Private Evidence PDF
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '入党积极分子考察测评/build_evidence_pdf.py'
      - '.github/workflows/build-party-activist-evidence-pdf.yml'
permissions:
  contents: write
jobs:
  merge:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PDF assembly dependencies
        run: |
          python -m pip install --disable-pip-version-check pypdf pillow reportlab
      - name: Assemble original proofs
        run: |
          python '入党积极分子考察测评/build_evidence_pdf.py'
      - name: Save PDF to private repository
        run: |
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '入党积极分子考察测评/06-证明汇编'
          if ! git diff --cached --quiet; then
            git commit -m 'Build private evidence PDF from original archived certificates'
            git push
          fi
