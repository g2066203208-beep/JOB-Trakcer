name: See-through Character Extraction
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/see-through-extract.yml"
      - "scripts/see-through-extract.mjs"
      - "character-puppet-lab/character.jpg"

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Gradio client
        run: npm install --no-save @gradio/client
      - name: Run official See-through ZeroGPU
        run: node scripts/see-through-extract.mjs
      - name: Commit generated PSD
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add character-see-through-lab/result.psd character-see-through-lab/result-meta.json
          git diff --cached --quiet && exit 0
          git commit -m "Add See-through extracted character PSD"
          git push
