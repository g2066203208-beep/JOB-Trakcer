name: Extract 2025 practice English pages
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ocr-boc-2025-english.yml'
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install OCR dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y tesseract-ocr tesseract-ocr-eng
          python -m pip install pymupdf
      - name: OCR 2025 practice pages
        run: |
          python '秋招工作室/笔试面试备考/中国银行2027_基础岗位类/ocr_2025_english.py'
      - name: Save recognized text (provisional)
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '秋招工作室/笔试面试备考/中国银行2027_基础岗位类/历年试题资料/2025/2025_英语原卷扫描识别_按页校对稿.md'
          if ! git diff --cached --quiet; then
            git commit -m 'OCR 2025 uploaded practice English pages for learning'
            git push
          fi
