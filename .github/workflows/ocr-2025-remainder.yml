name: OCR entire 2025 practice remainder
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ocr-2025-remainder.yml'
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install extraction tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y tesseract-ocr tesseract-ocr-chi-sim tesseract-ocr-eng
          python -m pip install pymupdf
      - name: Recognize scanned Chinese pages
        run: |
          python '秋招工作室/笔试面试备考/中国银行2027_基础岗位类/ocr_2025_remainder.py'
      - name: Save OCR source text
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '秋招工作室/笔试面试备考/中国银行2027_基础岗位类/历年试题资料/2025/2025_练习卷原PDF第30至48页_中文OCR待核.md'
          if ! git diff --cached --quiet; then
            git commit -m 'OCR final nineteen pages of 2025 practice scan'
            git push
          fi
