name: Probe Remote Spine Cases
on:
  workflow_dispatch:
  push:
    branches: [ main ]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe legacy PRTS assets
        shell: bash
        run: |
          set -euxo pipefail
          urls=(
            "https://static.prts.wiki/spine/char/char_003_kalts/char_003_kalts/char_003_kalts"
            "https://static.prts.wiki/spine/char/char_003_kalts/build_char_003_kalts/build_char_003_kalts"
            "https://static.prts.wiki/spine/skin/char_293_thorns/char_293_thorns_it_1/char_293_thorns_it_1"
          )
          for base in "${urls[@]}"; do
            echo "BASE=$base"
            for ext in json skel atlas png; do
              code=$(curl -L -A "Mozilla/5.0" -sS -o "/tmp/probe.$ext" -w "%{http_code}" "$base.$ext" || true)
              bytes=$(wc -c < "/tmp/probe.$ext" 2>/dev/null || echo 0)
              echo "$ext HTTP=$code bytes=$bytes"
              if [ "$ext" = "skel" ] && [ "$code" = "200" ]; then
                python3 - <<'PY'
p="/tmp/probe.skel"
b=open(p,"rb").read()
i=0
def vint():
 global i
 r=0;s=0
 while True:
  x=b[i];i+=1;r|=(x&127)<<s
  if x<128:return r
  s+=7
def string():
 n=vint()
 if n==0:return None
 if n==1:return ""
 n-=1
 global i
 z=b[i:i+n];i+=n
 return z.decode("utf-8","replace")
try:
 print("SKEL_HEADER",string(),string())
except Exception as e: print("HEADER_ERR",e)
PY
              fi
            done
          done
