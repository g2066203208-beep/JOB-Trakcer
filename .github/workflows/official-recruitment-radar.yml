name: Official Recruitment Radar

on:
  push:
    branches: [main]
    paths:
      - "官方招聘雷达工作室/**"
      - ".github/workflows/official-recruitment-radar.yml"
  schedule:
    # 00:30 UTC = 08:30 China Standard Time
    - cron: "30 0 * * *"
  workflow_dispatch:
    inputs:
      full_discovery:
        description: "Search all companies again, including those with known recruitment sites"
        type: boolean
        required: false
        default: true

permissions:
  contents: write

concurrency:
  group: official-recruitment-radar
  cancel-in-progress: false

jobs:
  scan:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      RADAR_SEARCH: "1"
      RADAR_FULL_DISCOVERY: ${{ github.event_name == 'workflow_dispatch' && inputs.full_discovery && '1' || '0' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install radar dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 tldextract ddgs

      - name: Scan official recruitment websites
        run: python "官方招聘雷达工作室/collector.py"

      - name: Commit updated radar data
        run: |
          git config user.name "job-tracker-radar"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "官方招聘雷达工作室/generated" "官方招聘雷达工作室/STATUS.md"
          if git diff --cached --quiet; then
            echo "No radar changes"
            exit 0
          fi
          git commit -m "radar: refresh official recruitment websites"
          git push
