<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#101216">
  <title>Pixel Motion Studio · 像素动画工作室</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <p>JOB-TRACKER · ART LAB</p>
      <h1>Pixel Motion Studio <span>v0.2 · RUN CYCLE</span></h1>
    </div>
    <div class="top-actions">
      <button id="newProject">新建</button>
      <button id="loadRunSample" class="primary">打开跑步示例</button>
      <label class="file-btn">导入图片<input id="importImage" type="file" accept="image/*"></label>
      <label class="file-btn">导入工程<input id="importProject" type="file" accept=".json,application/json"></label>
      <button id="saveProject">导出工程</button>
      <button id="exportPng" class="primary">导出 PNG</button>
      <button id="exportSheet" class="primary">导出精灵图</button>
    </div>
  </header>

  <main class="workspace">
    <aside class="left-panel panel">
      <section>
        <div class="section-title"><strong>工具</strong><span id="toolName">铅笔</span></div>
        <div class="tool-grid">
          <button class="tool active" data-tool="pencil" title="铅笔 (P)">✎<small>铅笔</small></button>
          <button class="tool" data-tool="eraser" title="橡皮 (E)">⌫<small>橡皮</small></button>
          <button class="tool" data-tool="fill" title="填充 (F)">▣<small>填充</small></button>
          <button class="tool" data-tool="eyedropper" title="吸管 (I)">◉<small>吸管</small></button>
          <button class="tool" data-tool="move" title="移动图层 (M)">✥<small>移动</small></button>
          <button id="clearLayer" class="tool danger" title="清空当前层">×<small>清层</small></button>
        </div>
      </section>

      <section>
        <div class="section-title"><strong>颜色</strong><span id="hexLabel">#1f2430</span></div>
        <input id="colorPicker" type="color" value="#1f2430">
        <div id="palette" class="palette"></div>
      </section>

      <section>
        <div class="section-title"><strong>画布</strong><span id="canvasMeta">64×64</span></div>
        <label class="field"><span>宽</span><input id="canvasWidth" type="number" min="8" max="512" value="64"></label>
        <label class="field"><span>高</span><input id="canvasHeight" type="number" min="8" max="512" value="64"></label>
        <button id="resizeCanvas" class="wide">调整尺寸</button>
        <label class="check"><input id="showGrid" type="checkbox" checked>显示像素网格</label>
        <label class="check"><input id="onionSkin" type="checkbox" checked>洋葱皮</label>
      </section>

      <section>
        <div class="section-title"><strong>缩放</strong><output id="zoomValue">800%</output></div>
        <input id="zoom" type="range" min="2" max="24" step="1" value="8">
        <button id="fitCanvas" class="wide">适应窗口</button>
      </section>
    </aside>

    <section class="stage panel">
      <div class="stage-toolbar">
        <div>
          <strong id="projectName">未命名像素动画</strong>
          <span id="cursorInfo">x: — y: —</span>
        </div>
        <div class="playback">
          <button id="prevFrame" title="上一帧">◀</button>
          <button id="playPause" class="play" title="播放/暂停">▶</button>
          <button id="nextFrame" title="下一帧">▶</button>
          <label>FPS <input id="fps" type="number" min="1" max="60" value="8"></label>
        </div>
      </div>
      <div id="canvasScroller" class="canvas-scroller">
        <div id="canvasHost" class="canvas-host">
          <canvas id="displayCanvas"></canvas>
        </div>
      </div>
      <div class="stage-footer">
        <span>左键绘制 · 右键吸色 · Shift+滚轮缩放</span>
        <span id="status">就绪</span>
      </div>
    </section>

    <aside class="right-panel panel">
      <section class="layers-section">
        <div class="section-title">
          <strong>图层</strong>
          <div class="mini-actions">
            <button id="addLayer" title="新建图层">＋</button>
            <button id="duplicateLayer" title="复制图层">⧉</button>
            <button id="deleteLayer" title="删除图层">−</button>
          </div>
        </div>
        <div id="layersList" class="layers-list"></div>
        <div class="layer-controls">
          <label>透明度 <input id="layerOpacity" type="range" min="0" max="1" step="0.05" value="1"></label>
          <div class="row">
            <button id="layerUp">上移</button>
            <button id="layerDown">下移</button>
          </div>
        </div>
      </section>

      <section>
        <div class="section-title"><strong>动画预览</strong><span id="previewMeta">Frame 1</span></div>
        <canvas id="previewCanvas" width="256" height="256"></canvas>
      </section>
    </aside>

    <section class="timeline panel">
      <div class="timeline-head">
        <div>
          <strong>时间轴</strong>
          <span id="frameCounter">1 / 1</span>
        </div>
        <div class="mini-actions">
          <button id="addFrame">＋ 新帧</button>
          <button id="duplicateFrame">⧉ 复制帧</button>
          <button id="deleteFrame">− 删除帧</button>
        </div>
      </div>
      <div id="timelineStrip" class="timeline-strip"></div>
    </section>
  </main>
</div>
<script type="module" src="./app.js?v=20261003-2050"></script>
</body>
</html>
