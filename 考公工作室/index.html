<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>考公工作室</title>
<style>
:root{--bg:#f4f1e9;--paper:#fffdf8;--ink:#222;--muted:#746f65;--line:#ded7c9;--accent:#9f2f24;--green:#2d6c52}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
main{max-width:920px;margin:auto;padding:42px 20px 80px}
header{border-bottom:2px solid var(--ink);padding-bottom:22px;margin-bottom:28px}
.eyebrow{font-size:12px;letter-spacing:.16em;color:var(--accent);font-weight:800}
h1{font-size:38px;margin:8px 0 8px}.sub{color:var(--muted);line-height:1.7}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.card{display:block;text-decoration:none;color:inherit;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:22px;box-shadow:0 6px 20px rgba(55,43,29,.04)}
.card:hover{border-color:#b9ad99;transform:translateY(-1px)}
.card h2{margin:0 0 8px;font-size:22px}.meta{color:var(--muted);font-size:13px}.bar{height:8px;background:#ebe6db;border-radius:999px;overflow:hidden;margin:18px 0 8px}.bar i{display:block;width:1.6667%;height:100%;background:var(--green)}
.done{color:var(--green);font-weight:800}.method{margin-top:26px;background:#ede8dc;border-left:4px solid var(--accent);padding:18px 20px;line-height:1.8}
footer{margin-top:34px;color:var(--muted);font-size:12px}
</style>
</head>
<body>
<main>
<header>
  <div class="eyebrow">STUDY WORKSPACE</div>
  <h1>考公工作室</h1>
  <div class="sub">把每天真实做过的题、圈过的原文、犯过的错误和最终答案留下来。<br>申论以白鹭 DAY60 讲解思路为主，半月谈讲义为题目和材料依据。</div>
</header>
<div class="grid">
  <a class="card" href="./申论DAY60/">
    <div class="meta">申论 · 60 DAYS</div>
    <h2>申论 DAY60</h2>
    <div class="bar"><i></i></div>
    <div><span class="done">DAY01 已完成</span> · 1 / 60</div>
    <p class="meta">当前：2020国考副省第二题 · M农场青年创业启示</p>
  </a>
  <div class="card">
    <div class="meta">COMING NEXT</div>
    <h2>行测 / 面试 / 时政</h2>
    <p class="meta">后续按学习实际进度继续建立，不提前堆空目录。</p>
  </div>
</div>
<div class="method">
  <b>DAY01 核心方法</b><br>
  先圈 → 看重复 → 找总括句 / 大动作 → 同类合并 → 前置提炼 → 总分作答
</div>
<footer>Last updated · 2026-10-03</footer>
</main>
</body>
</html>
