<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090b0f"><title>Rig Motion Lab · 骨骼动画工作室</title><link rel="stylesheet" href="styles.css?v=0.6.1"></head><body>
<div class="app">
<header class="topbar"><div class="brand">Rig Motion Lab<small>骨骼动画工作室 · Spine Motion Workspace · v0.6.1</small></div><div class="sep"></div><button id="newBtn">新建</button><button id="importBtn">导入</button><button id="saveBtn" class="primary">保存</button><button id="exportBtn">导出</button><div class="sep"></div><button id="undoBtn" class="icon" title="撤销 Ctrl+Z">↶</button><button id="redoBtn" class="icon" title="重做 Ctrl+Y">↷</button><div class="grow"></div><span class="pill"><span class="status-dot"></span><span id="saveState">本地工作区</span></span><button id="helpBtn">?</button></header>
<main class="work">
<aside class="panel left"><div><div class="tabs"><button class="active" data-left="cases">案例</button><button data-left="bones">骨骼</button><button data-left="projects">工程</button></div><input class="search" id="leftSearch" placeholder="搜索案例 / 骨骼"></div><div class="pane" id="leftPane"></div></aside>
<section class="center"><canvas id="stage"></canvas><div class="canvas-toolbar"><button id="playBtn" class="pill">▶</button><select id="animSelect" class="pill"></select><select id="speedSelect" class="pill"><option value="0.25">0.25×</option><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="1.5">1.5×</option><option value="2">2×</option></select><div class="spacer"></div><button id="gridBtn" class="pill">网格 ✓</button><button id="skinBtn" class="pill">皮肤 ✓</button><button id="rigBtn" class="pill">骨架 ✓</button><button id="namesBtn" class="pill">骨名</button><button id="onionBtn" class="pill">洋葱皮</button><button id="loopBtn" class="pill">循环 ✓</button><button id="fitBtn" class="pill">适配</button></div><div class="hud" id="hud"></div></section>
<aside class="panel right"><div class="inspector-tabs"><button class="active" data-ins="bone">骨骼</button><button data-ins="clip">动画</button><button data-ins="skin">皮肤</button><button data-ins="train">训练</button></div><div class="pane" id="insPane"></div></aside>
<section class="timeline"><div class="tl-head"><button id="prevFrame">◀</button><button id="nextFrame">▶</button><span class="time" id="timeLabel">0.000 / 0.000</span><input id="timeRange" class="range" type="range" min="0" max="1" step="0.001" value="0"><span class="pill">FPS <input id="fpsInput" style="width:46px;padding:3px" type="number" min="1" max="120" value="30"></span><button id="addKeyBtn">◆ 关键帧</button></div><div class="tracks" id="tracks"></div></section>
</main><footer class="footer"><span id="footProject">未加载工程</span><div class="grow"></div><span>拖骨点=移动 · Shift+拖=旋转 · Alt/中键拖=平移 · Space 播放 · Ctrl+Z 撤销</span></footer></div>
<input id="fileInput" type="file" multiple accept=".json,.zip,.skel,.atlas,.png" class="hidden"><div class="modal-wrap" id="modalWrap"><div class="modal" id="modal"></div></div>
<script src="data/cases.pack.js?v=0.6.1"></script><script src="data/learning.summary.js?v=0.6.1"></script><script src="app.js?v=0.6.1"></script></body></html>
