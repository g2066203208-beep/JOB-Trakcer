<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#5b5bd6">
<meta name="description" content="2027届土木、能源、CAE、汽车转行校园招聘追踪">
<title>JobTracker · 2027秋招</title>
<link rel="stylesheet" href="./styles.css">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <div class="brand-logo">J</div>
    <div><b>JobTracker</b><small>2027 秋招信息库</small></div>
  </div>

  <nav class="view-tabs">
    <button id="jobsTab" class="view-tab active">岗位 <span id="jobsTabCount">0</span></button>
    <button id="companiesTab" class="view-tab">企业库 <span id="companiesTabCount">0</span></button>
  </nav>

  <div class="top-actions">
    <a id="scanBtn" class="scan-btn" href="https://github.com/g2066203208-beep/JOB-Trakcer/actions/workflows/auto-discover.yml" target="_blank" rel="noopener" title="打开手动全网扫描控制台">↻ 手动全网扫描</a>
    <button id="themeBtn" class="icon-btn" title="切换主题">◐</button>
    <button id="loginBtn" class="btn light">登录</button>
    <div id="userBox" class="user-box hidden">
      <span id="userName"></span>
      <button id="logoutBtn" class="btn light">退出</button>
    </div>
  </div>
</header>

<main class="shell">
  <section class="intro">
    <div>
      <h1 id="viewTitle">岗位库</h1>
      <p id="viewSubtitle">土木本专业、能源、新能源、CAE、汽车机械转行都放进来。默认隐藏已截止岗位。</p>
    </div>
    <div class="quick-stats">
      <span><b id="totalCount">0</b>岗位</span>
      <span><b id="companyCount">0</b>企业</span>
      <span><b id="appliedCount">—</b>已申请</span>
      <span><b id="rejectedCount">—</b>被拒</span>
    </div>
  </section>

  <section class="toolbar">
    <label class="search-box">
      <span>⌕</span>
      <input id="searchInput" placeholder="搜索企业、岗位、地区、专业、技能、要求……">
    </label>

    <div id="jobFilters" class="filter-row">
      <select id="trackFilter"><option value="">全部方向</option></select>
      <select id="regionFilter"><option value="">全部地区</option></select>
      <select id="degreeFilter">
        <option value="">全部学历</option>
        <option value="本科">本科可投</option>
        <option value="硕士">硕士 / 研究生</option>
        <option value="博士">博士</option>
      </select>
      <select id="stageFilter">
        <option value="">全部状态</option>
        <option>未申请</option><option>已申请</option><option>被拒</option>
      </select>
      <select id="sortFilter">
        <option value="deadline-asc">截止最近</option>
        <option value="updated-desc">最新更新</option>
        <option value="company-asc">企业名称</option>
      </select>
      <button id="moreFiltersBtn" class="btn light">筛选</button>
    </div>

    <div id="companyFilters" class="filter-row hidden">
      <select id="sectorFilter"><option value="">全部行业</option></select>
      <select id="companyStatusFilter">
        <option value="">全部企业</option>
        <option value="hasJobs">已有岗位</option>
        <option value="pending">待扫描</option>
      </select>
      <select id="companySortFilter">
        <option value="jobs-desc">岗位多 → 少</option>
        <option value="name-asc">企业名称</option>
      </select>
    </div>
  </section>

  <section id="advancedFilters" class="advanced hidden">
    <label><input id="showExpired" type="checkbox"> 显示已截止</label>
    <select id="sourceFilter"><option value="">全部来源</option><option value="verified">官方 / 已核验</option><option value="unverified">全网发现待核验</option></select>
    <select id="typeFilter"><option value="">全部类型</option><option>具体岗位</option><option>具体方向</option><option>招聘批次</option><option>招聘入口</option><option>方向入口</option><option>转行入口</option><option>转行观察</option><option>自动发现</option></select>
    <button id="onlyMineBtn" class="btn light">只看已标记</button>
    <button id="resetBtn" class="btn ghost">清空全部</button>
  </section>

  <section id="jobsView" class="content-card">
    <div class="content-head">
      <div><b id="resultCount">0</b> 条结果 <span id="filterHint"></span></div>
      <div class="head-note">7天内显示“即将截止” · 点击“截止”排序</div>
    </div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th><button id="deadlineSortBtn" class="th-btn">截止 <span id="deadlineArrow">↑</span></button></th>
            <th>企业 / 岗位</th>
            <th>地点</th>
            <th>学历 / 专业</th>
            <th>要求</th>
            <th>来源</th>
            <th>申请</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="jobRows"></tbody>
      </table>
    </div>
    <div id="emptyState" class="empty hidden">没有符合条件的岗位。</div>
  </section>

  <section id="companiesView" class="hidden">
    <div class="company-overview">
      <div><b id="companyResultCount">0</b> 家企业</div>
      <div>企业库会持续扫描；有岗位的直接进入岗位列表，没有的保留为“待扫描”。</div>
    </div>
    <div id="companyGrid" class="company-grid"></div>
    <div id="companyEmpty" class="empty hidden">没有符合条件的企业。</div>
  </section>

  <footer>
    <span>招聘信息以官方页面最终公告为准；全网发现条目投递前请核验原始来源。</span>
    <span id="syncStatus">未登录 · 浏览模式</span>
  </footer>
</main>

<dialog id="detailDialog">
  <div class="modal">
    <div class="modal-head">
      <div><small>岗位详情</small><h2 id="detailTitle"></h2><p id="detailCompany"></p></div>
      <button class="x-btn" data-close="detailDialog">×</button>
    </div>
    <div id="detailContent" class="detail-grid"></div>
    <div class="modal-actions">
      <button id="detailNoteBtn" class="btn light">备注</button>
      <a id="detailSource" class="btn light" target="_blank" rel="noopener">查看来源</a>
      <a id="detailApply" class="btn primary" target="_blank" rel="noopener">去投递 ↗</a>
    </div>
  </div>
</dialog>

<dialog id="authDialog">
  <form class="modal auth-modal" onsubmit="return false">
    <div class="modal-head"><div><small>账户</small><h2>登录 / 注册</h2><p id="authModeHint"></p></div><button class="x-btn" data-close="authDialog">×</button></div>
    <div class="tabs"><button id="tabLogin" class="tab active">登录</button><button id="tabSignup" class="tab">注册</button></div>
    <label>邮箱<input id="authEmail" type="email" placeholder="you@example.com"></label>
    <label>密码<input id="authPassword" type="password" placeholder="至少 6 位"></label>
    <div id="authMessage" class="form-message"></div>
    <button id="authSubmit" class="btn primary wide">登录</button>
    <p id="authFine" class="fine"></p>
  </form>
</dialog>

<dialog id="noteDialog">
  <form class="modal" onsubmit="return false">
    <div class="modal-head"><div><small>私人备注</small><h2 id="noteTitle"></h2></div><button class="x-btn" data-close="noteDialog">×</button></div>
    <textarea id="noteText" rows="7" placeholder="例如：已投哪一岗位、联系人、后续事项……"></textarea>
    <div class="modal-actions"><button id="deleteStateBtn" class="btn danger">删除记录</button><button id="saveNoteBtn" class="btn primary">保存</button></div>
  </form>
</dialog>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./supabase-config.js"></script>
<script src="./jobs-data.js"></script>
<script src="./auto-jobs-data.js"></script>
<script src="./companies-data.js"></script>
<script src="./app.js"></script>
</body>
</html>
